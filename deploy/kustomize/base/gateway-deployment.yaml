apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ops-copilot/gateway:latest
          ports:
            - containerPort: 8001
          env:
            - name: ORDERS_URL
              value: "http://orders:8002"
            - name: PAYMENTS_URL
              value: "http://payments:8003"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
