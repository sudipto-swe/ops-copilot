name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy apps/api/app target

      - name: Run test suite with coverage
        run: |
          cp .env.example .env
          pytest --cov=apps/api/app --cov-report=term-missing --cov-report=xml

      - name: Smoke check
        run: |
          bash scripts/smoke.sh
